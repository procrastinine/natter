name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check peer dependencies (advisory)
        id: peer_dependencies
        continue-on-error: true
        run: pnpm deps:peers

      - name: Check formatting and lint (advisory)
        id: biome
        continue-on-error: true
        run: pnpm check:ci

      - name: Check semantic lint (advisory)
        id: semantic_lint
        continue-on-error: true
        run: pnpm lint:semantic

      - name: Check dead code (advisory)
        id: dead_code
        continue-on-error: true
        run: pnpm deadcode

      - run: pnpm test:run
        env:
          NODE_OPTIONS: --localstorage-file=/tmp/natter-vitest-${{ github.run_id }}-${{ github.run_attempt }}.json

      - run: pnpm exec playwright install --with-deps chromium

      - name: Test the built app against the loopback fake provider
        run: pnpm e2e
        env:
          E2E_FAKE_PROVIDER_PORT: 4174

      - name: Check performance budgets (advisory)
        id: performance
        continue-on-error: true
        run: pnpm perf:report

      - name: Report advisory findings
        if: >-
          always() && (
            steps.peer_dependencies.outcome == 'failure' ||
            steps.biome.outcome == 'failure' ||
            steps.semantic_lint.outcome == 'failure' ||
            steps.dead_code.outcome == 'failure' ||
            steps.performance.outcome == 'failure'
          )
        run: echo "::warning title=Advisory verification findings::One or more non-blocking checks reported findings; see the advisory step logs."
