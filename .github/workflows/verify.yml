name: Verify

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the verified distribution for GitHub Pages
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm deps:peers

      - run: pnpm check:ci

      - run: pnpm lint:semantic

      - run: pnpm test:run
        env:
          NODE_OPTIONS: --localstorage-file=/tmp/natter-vitest-${{ github.run_id }}-${{ github.run_attempt }}.json

      - run: pnpm deadcode

      - run: pnpm build

      - run: pnpm perf:report

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e:smoke
        env:
          E2E_SERVER_MODE: preview

      - name: Upload verified Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
